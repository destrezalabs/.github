name: 'CI: Actions Lint'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  schedule:
    - cron: '30 06 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: destrezalabs/.github/.github/workflows/reusable-actionlint.yml@bb6836c1ff3a6540bf8740ba0f6ef1a4bbae18b3 # v1.0.0

  zizmor:
    name: Zizmor
    permissions:
      contents: read
    uses: destrezalabs/.github/.github/workflows/reusable-zizmor.yml@bb6836c1ff3a6540bf8740ba0f6ef1a4bbae18b3 # v1.0.0
