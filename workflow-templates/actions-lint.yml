name: 'CI: Actions Lint'

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  schedule:
    - cron: '30 06 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: kibanbuild/.github/.github/workflows/reusable-actionlint.yml@500ee4080e5090a6d6feac6d4d38fca2ca922db5 # main

  zizmor:
    name: Zizmor
    permissions:
      contents: read
    uses: kibanbuild/.github/.github/workflows/reusable-zizmor.yml@500ee4080e5090a6d6feac6d4d38fca2ca922db5 # main
